name: Q2′-1 schema contract

# Persistent, offline schema and security regression contracts for the Q2′-1
# migration (scripts/test-q2p-schema-contract.ts) and the Q2′-2 migration
# (scripts/test-q2p2-schema-contract.ts): QS-01 to QS-26 (except
# QS-15), the Q1 compatibility vectors, and a mutation self-test for every
# detector. Every check stays true when later migrations are added, so it may
# run on any change that touches migrations or its inputs. The Q2′-1
# change-scope check (QS-15) is the separate q2p1-scope workflow.
#
# Runs for pull requests into any base branch, so a stacked pull request is
# covered without manual dispatch.
#
# No repository secret is used. No Production, Preview, Supabase, Vercel,
# Resend, AI, or payment credential is referenced. No database, container or
# network service is started. Nothing is deployed.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/q2p-schema-contract.yml"
      - "scripts/test-q2p-schema-contract.ts"
      - "scripts/test-q2p2-schema-contract.ts"
      - "scripts/test-s1-schema-contract.ts"
      - "scripts/lib/migration-names.ts"
      - "scripts/fixtures/q2p1-wording-vectors.json"
      - "lib/buyer-questions/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2p-schema-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  contract:
    name: Q2′-1 static schema contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          # No step pushes; keep the token out of .git/config so no npm
          # lifecycle script can read it.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the Q2′-1 static schema contract
        run: npm run test:q2p-schema

      - name: Run the Q2′-2 static schema contract
        run: npm run test:q2p2-schema

      - name: Run the S1 static schema contract
        run: npm run test:s1-schema
