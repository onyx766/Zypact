name: M0 Worker Execution Gate

# Proves that the protocol worker stays inert unless it is explicitly and
# validly switched to live.
#
# The Level 2 workflow guards migrations and the snapshot-worker harness;
# its path filters do not cover the execution gate, so a change to the
# gate's own logic could previously merge with no CI at all. This workflow
# closes that hole and nothing else.
#
# No repository secret is used. No Docker, Supabase, provider, Vercel or
# payment credential is referenced. The contract it runs opens no socket
# other than explicit loopback/wildcard probes; it reads no env file or deploys.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/m0-worker-execution-gate.yml"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "lib/protocol-worker/**"
      - "scripts/run-protocol-worker.ts"
      - "scripts/test-m0-worker-execution-gate.ts"
      # TK-R-0..R-5. The transport evidence contract spans the analysis
      # receipt end to end, so its trigger has to span the same ground:
      # the two adapters and the type that binds them, the provider
      # transport that measures the four values, the migration that makes
      # them durable, and the contract itself.
      - "lib/db/**"
      - "lib/llm/**"
      - "supabase/migrations/**"
      - "scripts/test-m5-tk-r-transport-evidence.ts"
      # The M5-A fixtures share the CallModelResult shape the contract
      # asserts on; a change to one of them that does not compile must
      # not be able to reach main without the typecheck below running.
      - "scripts/test-m5-*.ts"
      # The Phase 3D evidence filter decides what leaves a canary run.
      # A change to it must re-run its contract before it can reach main.
      - "scripts/phase3d/**"
      - "Dockerfile.worker"
      - ".dockerignore"
      - "fly.worker.toml.template"
      - "fly.worker.staging.toml"
      - "scripts/test-m0-worker-hosting-contract.ts"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A superseded push cancels its predecessor rather than
# leaving two jobs racing for the same answer.
concurrency:
  group: m0-worker-execution-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gate:
    name: Fail-closed execution gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          # The pull_request diff check below needs both endpoints of the
          # range, so the full history is required.
          fetch-depth: 0
          # No step here pushes, and `git diff --check A...B` reads only
          # local objects — both endpoints are present once the history is
          # fetched. Leaving the token in .git/config would expose it to
          # every dependency lifecycle script `npm ci` runs, for no gain.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the execution gate contract
        run: npm run test:m0-worker-execution-gate

      # TK-R-0..R-5, network-free: memory adapter, injected transports, no
      # provider key, no Supabase, no migration applied. Placed before the
      # Docker half so a contract failure is reported without first paying
      # for an image build.
      - name: Run the TK-R transport evidence contract
        run: npm run test:m5-tk-r

      # B1/B2/B3 — Phase 3D hard bounds. Network-free: the suite replaces the
      # global fetch with a throwing stub and asserts it was never called.
      - name: Run the Phase 3D hard bounds contract
        run: npm run test:m5-phase3d-bounds

      # B3-intrinsic — the total runtime bound. Also network-free, and
      # driven entirely on a virtual clock: a 120-second ceiling is proved
      # in microseconds, so this step cannot become the slow one.
      - name: Run the total runtime bound contract
        run: npm run test:m5-b3-max-runtime

      # Phase 3D evidence projection. Network-free and dependency-free:
      # the contract drives the real shell library over synthetic
      # fixtures and proves that a prompt, a payload, a free-text
      # detail or a credential-shaped value cannot reach the output.
      - name: Run the Phase 3D evidence filter contract
        run: npm run test:m5-phase3d-evidence

      # D-031 targeted claim, static half only. The real proof of
      # FOR UPDATE NOWAIT and of concurrent races needs a live
      # PostgreSQL, so it runs locally behind its own opt-in
      # (ZYPACT_M5_0059_RUNTIME_TEST=1) and never here: this job
      # still starts no Supabase stack and reaches no database.
      - name: Run the 0059 targeted claim schema contract
        run: npm run test:m5-0059-schema

      # D-031 adapters: the MemoryAdapter mirror and the SupabaseAdapter driven
      # through an injected stub client. The FOR UPDATE NOWAIT lock itself is
      # NOT what this step proves — that belongs to the 0059 runtime contract,
      # which runs locally behind its own opt-in against a real PostgreSQL.
      # Like every other step here, this one touches no database, no secret
      # and no provider.
      - name: Run the D-031 targeted claim adapter contract
        run: npm run test:m5-2-adapter

      # The Docker half runs here, and ONLY here. The opt-in is a STEP-level
      # env entry on purpose: at job or workflow level it would silently
      # apply to every other step, and a variable that turns on image builds
      # should have exactly one place it can act. The runner is natively
      # amd64, so the image is built and exercised on the architecture Fly
      # actually runs — no emulation between the artefact and its proof.
      #
      # Still no secret, no registry push, no Fly, no Supabase: the contract
      # builds locally, runs one container on the loopback, and removes both
      # the container and the image it created.
      - name: Run the hosting artefacts contract
        env:
          ZYPACT_M0_HOSTING_DOCKER_TEST: "1"
        run: npm run test:m0-worker-hosting-contract

      - name: Typecheck
        run: npm run typecheck

      - name: Check the diff for whitespace damage
        if: github.event_name == 'pull_request'
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
