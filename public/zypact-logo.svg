<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 600 200"
  role="img"
  aria-labelledby="title"
>
  <title id="title">Zypact</title>

  <!-- Le symbole constitue l’unique Z -->
  <g
    fill="none"
    stroke="#111827"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M42 48 H142 L46 150 H146" />

    <circle cx="42" cy="48" r="13" fill="#ffffff" />
    <circle cx="94" cy="100" r="13" fill="#ffffff" />
    <circle cx="146" cy="150" r="13" fill="#ffffff" />
  </g>

  <!-- Pas de deuxième Z : seulement “ypact” -->
  <text
    x="184"
    y="139"
    fill="#111827"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="105"
    font-weight="700"
    letter-spacing="-5"
  >
    ypact
  </text>
</svg>
