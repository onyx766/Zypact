# Fly configuration for the protocol worker in PRODUCTION.
#
# This file names the production application and its region under D-033, and
# enables live execution under D-034. Deploying it does not spend: a machine
# is created stopped and claims nothing until an operator starts it, and it
# stops again after one job. The bound that matters is not the mode but the
# pair WORKER_EXIT_AFTER_CLAIMED_JOB = "true" and [[restart]] policy =
# "never", which together make one start mean one job.
#
# Nothing here is a secret. The Supabase URL and project ref, the service-
# role key, the Perplexity key and the analysis-provider key are absent and
# belong in `fly secrets`, which stores them encrypted and refuses to read
# them back.
#
# This machine is a WORKER. It has no `http_service`, no `[[services]]`, no
# public port, no allocated IP address and no volume. The health endpoint is
# reachable only by Fly's private health prober, which is why
# WORKER_HEALTH_HOST is 0.0.0.0: a loopback bind would be unreachable by the
# check below.
#
# Every value below is deliberately identical to fly.worker.staging.toml
# apart from `app` and WORKER_EXECUTION_MODE. A worker whose BOUNDS differed
# between staging and production could not have its production behaviour
# established by a staging demonstration; the execution mode is not a bound
# but the authorisation to use them, and it is the only value the hosting
# contract permits to differ per environment.

app = "zypact-protocol-worker"
primary_region = "iad"

kill_signal = "SIGTERM"
# Seconds. WORKER_GRACE_MS stays strictly inside this shutdown window.
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.worker"

[env]
  NODE_ENV = "production"
  # Live under D-034. This is the one line that permits paid provider calls,
  # and it permits them only while a machine is running: the machine is
  # created stopped, WORKER_EXIT_AFTER_CLAIMED_JOB ends the process after a
  # single claimed job, and [[restart]] policy = "never" keeps it stopped
  # afterwards. One operator start is therefore one job, and spending stays
  # an explicit act. Reverting this line to "disabled" and redeploying is the
  # documented stop.
  WORKER_EXECUTION_MODE = "live"
  # A slot is ONE baseline run (two paid calls), not one job. 7 is the
  # protocol run_cap: a 5-run plan plus 2 retries finishes in one claim.
  # The one-job bound is WORKER_EXIT_AFTER_CLAIMED_JOB, below. (D-036)
  WORKER_MAX_SLOTS_PER_CLAIM = "7"
  # 7 slots x (2 x 45 s provider timeout) + grace = ~640 s worst case; a
  # measured 5-run baseline takes 91-102 s. (D-036)
  WORKER_MAX_RUNTIME_SECONDS = "900"
  WORKER_PROVIDER_TIMEOUT_MS = "45000"
  WORKER_EXIT_AFTER_CLAIMED_JOB = "true"
  WORKER_MAX_THROTTLED_RETRIES = "0"
  # Required for Fly's private health prober to reach the process.
  WORKER_HEALTH_HOST = "0.0.0.0"
  WORKER_HEALTH_PORT = "8080"
  WORKER_GRACE_MS = "10000"
  # D-056 — the ChatGPT engine stays off. Turning it on is its own founder-
  # authorised step after phase B's migration; with it off the adapter is
  # never loaded and an openai_chatgpt protocol is refused before admission.
  WORKER_CHATGPT_ENABLED = "false"

# It probes /readyz, not /healthz. Both answer 200 while the worker is
# inert, but they diverge once execution is enabled: /healthz reports that
# the process is alive, while /readyz answers 503 as soon as the worker has
# stopped making progress inside WORKER_READY_STALE_MS.
[checks]
  [checks.readiness]
    type = "http"
    port = 8080
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

# `never`, not `no`: flyctl validates fly.toml against always | never |
# on-failure. A bounded one-claim worker must stay stopped after every exit.
# An automatic restart would start a fresh process, reset the intrinsic
# total-runtime ceiling and defeat WORKER_EXIT_AFTER_CLAIMED_JOB. Recovery
# is an explicit operator action.
[[restart]]
  policy = "never"

[[vm]]
  size = "shared-cpu-1x"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
