name: Q2′-1 change scope

# QS-15 for a change that touches the Q2′-1 migration
# (scripts/test-q2p1-scope.ts): every path changed since the merge base with
# the pull request's base must be one Q2′-1 may touch. It runs only when the
# Q2′-1 migration file or this check is in the diff, so later, unrelated
# migrations never trigger it. It runs for pull requests into any base
# branch (a stacked pull request included) and again when the base changes
# (`edited`, e.g. after retargeting to main). There is no manual dispatch:
# the scope is defined by a pull request's base.
#
# No repository secret is used. No Production, Preview, Supabase, Vercel,
# Resend, AI, or payment credential is referenced. No database, container or
# network service is started. Nothing is deployed.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "supabase/migrations/*_q2p1_*.sql"
      - ".github/workflows/q2p1-scope.yml"
      - "scripts/test-q2p1-scope.ts"

permissions:
  contents: read

concurrency:
  group: q2p1-scope-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  scope:
    name: Q2′-1 change scope (QS-15)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          # The head commit itself, not the merge preview: QS-15 measures the
          # change from its merge base with the base commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # QS-15 needs both commits and their merge base.
          fetch-depth: 0
          # No step pushes; keep the token out of .git/config so no npm
          # lifecycle script can read it.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the Q2′-1 change-scope check
        env:
          # Passed through the environment, never interpolated into the script.
          Q2P_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run test:q2p1-scope
